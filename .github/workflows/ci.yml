name: Game Runtime CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Preserve generated dependency lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arkvoid-npm-lockfile
          path: package-lock.json
          if-no-files-found: warn
          retention-days: 3
      - name: Verify project
        run: npm run verify
